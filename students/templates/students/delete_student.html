
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>
    <link rel="stylesheet" href="{% static 'students/style.css' %}">
</head>
<body>

<div class="main-content">

    <div class="header form-page-header">
        <div>
            <h1>Delete Student</h1>
            <p>Review the student details before deleting.</p>
        </div>
    </div>

    <div class="student-form">

        <div class="student-details">
            <p>
                <strong>Register Number:</strong>
                {{ student.register_number }}
            </p>

            <p>
                <strong>Name:</strong>
                {{ student.full_name }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ student.email }}
            </p>
        </div>

        <div style="margin-top: 25px;">
            <form method="POST" style="margin: 0; padding: 0; box-shadow: none; background: transparent;">
                {% csrf_token %}

                <button type="submit" style="background: #dc2626; color: white; padding: 12px 18px; border-radius: 8px;">
                    Yes, Delete Student
                </button>

                <a href="{% url 'student_list' %}" style="margin-left: 12px;">
                    Cancel
                </a>
            </form>
        </div>

    </div>

</div>

</body>
</html>
